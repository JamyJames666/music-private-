services:
  muse:
    build: .
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - WEB_PASSWORD=${WEB_PASSWORD}
      - WEB_PORT=4000
      - YT_DLP_AUTO_UPDATE=true
      - BULK_ADD_PASSWORD=${BULK_ADD_PASSWORD}
      - DISABLE_WEB_ANNOUNCEMENTS=${DISABLE_WEB_ANNOUNCEMENTS}
      - WEB_ONLY_MODE=${WEB_ONLY_MODE}
      - ADMIN_ONLY=${ADMIN_ONLY}
      # Spotify Connect (librespot). Muse appears as a speaker in your Spotify
      # device list. Requires Spotify Premium.
      - SPOTIFY_CONNECT_ENABLED=${SPOTIFY_CONNECT_ENABLED}
      - SPOTIFY_CONNECT_DEVICE_NAME=${SPOTIFY_CONNECT_DEVICE_NAME}
      - SPOTIFY_CONNECT_BITRATE=${SPOTIFY_CONNECT_BITRATE}
      - SPOTIFY_CONNECT_ENABLE_OAUTH=${SPOTIFY_CONNECT_ENABLE_OAUTH}
      - SPOTIFY_CONNECT_OAUTH_PORT=5588
    expose:
      - "4000"
    ports:
      # librespot's OAuth redirect server. Bound to loopback because it is only
      # ever reached through an SSH tunnel from the machine running the browser:
      #   ssh -L 5588:localhost:5588 you@your-server
      # Only needed while signing in for the first time; credentials are cached
      # to /data afterwards.
      - "127.0.0.1:5588:5588"
    # Spotify also discovers Connect devices over mDNS, but that never crosses
    # Docker's bridge network — and on a cloud host it cannot reach your phone
    # at all. Host networking only helps on a Linux box on the same LAN; use
    # SPOTIFY_CONNECT_ENABLE_OAUTH=true anywhere else.
    # network_mode: host
    volumes:
      - muse-data:/data

volumes:
  muse-data:
